[project]
name = "rpa-agent"
version = "0.1.0"
description = "LangGraph agent that selects an RPA view and its parameters, fetches data, and learns over time"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2",
    "pandas",
    "python-dateutil",
    "pyyaml",
    "filelock",
]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rpa_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
