# Repo root: a workspace of independent agent packages plus shared libraries.
# Each member has its own pyproject.toml; this file only ties them together.

[tool.uv.workspace]
members = ["libs/*", "agents/*"]

[tool.pytest.ini_options]
# Run every package's tests from the root: `pytest`
addopts = "--import-mode=importlib"
testpaths = ["libs", "agents"]
pythonpath = [
    "libs/agent_core/src",
    "agents/rpa_agent/src",
    "agents/rpa_agent/tests",
    "agents/rpa_agent",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["agent_core", "rpa_agent"]
